profiles:
  esp32p4_host:
    fqbn: esp32:esp32:esp32p4:FlashSize=16M,PSRAM=enabled,ChipVariant=prev3,USBMode=hwcdc,CDCOnBoot=cdc,UploadMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      # HR-1/HR-2 are not released yet. Pin the working tree in the run report.
      - dir: /home/mt/dev/EspUsbHost
default_profile: esp32p4_host
