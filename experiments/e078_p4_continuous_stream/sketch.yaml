profiles:
  esp32p4_parlio:
    fqbn: esp32:esp32:esp32p4:FlashSize=16M,PSRAM=enabled,ChipVariant=prev3,USBMode=default,CDCOnBoot=default,UploadMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      # Working tree, not the Library Manager copy: CR-4 / CR-7 / CR-9 are not in
      # a release yet. Real path, because arduino-cli skips the .cpp files behind
      # a symlink (CR-6). Pinned in the report by commit, not by version.
      - dir: /home/mt/dev/EspUsbDevice
default_profile: esp32p4_parlio
